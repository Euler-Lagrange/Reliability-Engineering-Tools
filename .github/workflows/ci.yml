name: CI

# The desktop target is Windows-only (the Rust bridge uses Windows Job Objects
# and the sidecar is packaged for Windows), so CI runs on windows-latest to
# catch the cross-machine drift that requirements.txt / Cargo.lock now pin.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, audit (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python dependencies (pinned)
        run: python -m pip install -r requirements-dev.txt

      # ---- checks (each is the same command developers run locally) ----

      - name: TypeScript typecheck (app)
        run: npm run typecheck

      - name: TypeScript typecheck (tests)
        run: npm run typecheck:tests

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Version consistency check
        run: npm run version:check

      - name: Backend tests (pytest)
        run: python -m pytest backend/tests -q

      - name: Sidecar self-test + security audit
        run: python backend/python/sidecar_main.py --self-test

      - name: Rust bridge check
        run: npm run cargo:check

      - name: Rust bridge tests
        run: npm run cargo:test
